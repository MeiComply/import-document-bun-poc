apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-import-document-service-BUN
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-import-document-service-BUN
  template:
    metadata:
      labels:
        app: test-import-document-service-BUN
    spec:
      containers:
        - name: test-import-document-service-BUN
          image: 800210167969.dkr.ecr.ap-south-1.amazonaws.com/import-document-service-test-bun:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
